<!DOCTYPE html>
<html lang="en">


<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock SaaS Admin Console</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-slate-900 text-slate-100 p-8">

    <div class="max-w-3xl mx-auto space-y-6">

        <header class="border-b border-slate-800 pb-4 flex justify-between items-center">

            <div>

                <h1 class="text-xl font-bold text-orange-500">Mock Admin Console</h1>
                <p class="text-xs text-slate-400">Stimulated Target for AutoSaaS AI Agent</p>

            </div>

            <button id="open-modal-btn" onclick="toggleModal(true)" class="bg-orange-600 hover:bg-orange-700 px-4 py-2 rounded-lg text-sm font-medium transition">
                + Add User
            </button>

        </header>


        <!-- User Table Grid -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">

            <table class="w-full text-left text-sm text-slate-300">

                <thead class="bg-slate-900 text-slate-400 uppercase text-xs">

                    <tr>

                        <th class="p-3">Email</th>
                        <th class="p-3">Role</th>
                        <th class="p-3">Status</th>

                    </tr>

                </thead>

                <tbody id="userTableBody" class="divide-y divide-slate-700">

                    <!-- Dynamically populated by agent actions -->

                </tbody>

            </table>

        </div>

    </div>

    
    <!-- Modal Form -->
     <div id="userModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center">

        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 w-96 space-y-4">

            <h2 class="font-semibold text-lg">Provision New User</h2>
            <input type="email" id="email-input" placeholder="user@company.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100"/>

            <!-- TC3 Simulation: Notice how the default value here is forced to 'Admin' to test role correction -->
            <select id="role-dropdown" class="w-full bg-slate-900 border-slate-700 rounded-lg p-2 text-sm text-slate-100">

                <option value="Admin" selected>Admin (Default Bug)</option>
                <option value="Manager">Manager</option>
                <option value="Member">Member</option>

            </select>

            <div class="flex justify-end space-x-2">

                <button onclick="toggleModal(false)" class="px-4 py-2 rounded-lg text-sm bg-slate-700 hover:bg-slate-600">Cancel</button>
                <button id="submit-user-btn" onclick="submitUser()" class="px-4 py-2 rounded-lg text-sm bg-emerald-600 hover:bg-emerald-700">Save User</button>
                
            </div>

        </div>

    </div>


    <script>

        function toggleModal(show) {

            document.getElementById('userModal').classList.toggle('hidden', !show);

        }

        function submitUser() {

            const email = document.getElementById('email-input').value;
            const role = document.getElementById('role-dropdown').value;

            const tbody = document.getElementById('userTableBody');
            const row = document.createElement('tr');

            row.className = "user-succes-row";
            row.innerHTML = `<td class="p-3">${email}</td><td class="p-3">${role}</td><td class="p-3 text-emerald-400">Active</td>`;
            tbody.appendChild(row);

            toggleModal(false);
            document.getElementById('email-input').value = '';

        }

    </script>

</body>
</html>
